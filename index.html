<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>顔福笑い | カメラゲーム</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f7f7fb;background:#101118}*{box-sizing:border-box}body{margin:0}main{width:min(600px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}h1{font-size:21px;margin:16px 0 8px}.sub{font-size:12px;color:#b6b7c4;line-height:1.6;margin:4px 0 14px}.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}button{border:0;border-radius:12px;background:#353744;color:white;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#7562e8}button.active{outline:2px solid #c1b4ff;background:#49416b}button:disabled{opacity:.5}.camera{position:relative;width:100%;aspect-ratio:3/4;background:#20212c;overflow:hidden;border-radius:20px;border:1px solid #3b3c4a;touch-action:manipulation}.camera canvas{width:100%;height:100%;object-fit:contain;display:block}.hint{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#0009;border-radius:12px;padding:8px 10px;font-size:14px;pointer-events:none}.tap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#7562e8eb;border-radius:999px;padding:12px 22px;font-weight:800;pointer-events:none;white-space:nowrap}.stat{font-size:14px;padding:5px 0;color:#dadbe9}.warning{border-radius:10px;padding:10px;background:#3e3020;color:#ffe0aa;font-size:13px;margin-top:10px;line-height:1.6}.help{font-size:13px;color:#c5c5d2;line-height:1.8}video{display:none}
</style></head><body><main><h1>顔福笑い <span style="font-size:12px;color:#bdb9ef">試作版</span></h1><div class="sub">カメラ映像の顔を使ったゲーム。映像は端末内で処理し、サーバーに送信しません（顔認識用ライブラリの初回読み込みには通信が必要）。</div>
<div class="bar"><button id="fall" class="active">↓ 上から落下</button><button id="radial">↗ 中心から外へ</button></div>
<div class="camera" id="screen"><canvas id="canvas" width="720" height="960"></canvas><div class="hint" id="hint">「カメラを起動」を押してください</div><div class="tap" id="tapHint" hidden>まばたき / 画面タップで止める</div></div>
<div class="stat" id="stats">モード：上から落下</div><div class="bar"><button class="primary" id="start">カメラを起動</button><button id="restart" disabled>最初から</button><button id="stop" disabled>カメラ停止</button></div>
<div class="help">使い方：正面を向き、顔が画面に収まる距離で撮影します。ゲーム開始後、動くパーツを好みの位置で<strong>まばたき</strong>するか<strong>画面タップ</strong>して止めます。眉・目・鼻・口を順番に配置します。カメラ起動にはHTTPS（またはlocalhost）が必要です。</div><div id="error" class="warning" hidden></div></main><video id="video" autoplay muted playsinline></video>
<script type="module">
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false}),vid=$('video');
const W=720,H=960;const parts=[{name:'左眉',ids:[70,105,107,66],factor:1.45},{name:'右眉',ids:[300,334,336,296],factor:1.45},{name:'左目',ids:[33,133,159,145,160,144],factor:1.5},{name:'右目',ids:[362,263,386,374,385,380],factor:1.5},{name:'鼻',ids:[1,4,6,19,98,327],factor:1.45},{name:'口',ids:[61,291,13,14,0,17],factor:1.4}];
let landmarker=null,stream=null,mode='fall',index=0,running=false,ready=false,finished=false,previousBlink=false,lastStop=0,landmarks=null,blendshapes=[],faceBox=null,raf=0,lastVideoTime=-1,beginTime=0;
const cameraFrame=document.createElement('canvas');cameraFrame.width=W;cameraFrame.height=H;const fctx=cameraFrame.getContext('2d');const patch=document.createElement('canvas');const pctx=patch.getContext('2d');
function status(s){$('stats').textContent=s}function error(s){$('error').hidden=false;$('error').textContent=s}function clearError(){$('error').hidden=true}
function setMode(next){mode=next;$('fall').classList.toggle('active',next==='fall');$('radial').classList.toggle('active',next==='radial');status('モード：'+(next==='fall'?'上から落下':'中心から外へ'));if(ready)restart()}
$('fall').onclick=()=>setMode('fall');$('radial').onclick=()=>setMode('radial');
const mirrorX=x=>W*(1-x), my=y=>H*y;
function getPoint(pts,id){const p=pts[id];return {x:mirrorX(p.x),y:my(p.y)}}
function getBounds(pts,part){const pp=part.ids.map(i=>getPoint(pts,i));let l=Math.min(...pp.map(p=>p.x)),r=Math.max(...pp.map(p=>p.x)),t=Math.min(...pp.map(p=>p.y)),b=Math.max(...pp.map(p=>p.y));const cx=(l+r)/2,cy=(t+b)/2,w=Math.max(26,(r-l)*part.factor),h=Math.max(19,(b-t)*part.factor);return {x:cx-w/2,y:cy-h/2,w,h,cx,cy}}
function drawMirroredFrame(){fctx.clearRect(0,0,W,H);const vw=vid.videoWidth||W,vh=vid.videoHeight||H,scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;fctx.save();fctx.translate(W,0);fctx.scale(-1,1);fctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh);fctx.restore()}
// Map normalized MediaPipe coordinates onto an object-fit:cover mirrored canvas.
function videoMappedPoint(pts,id){const p=pts[id],vw=vid.videoWidth||W,vh=vid.videoHeight||H,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;return{x:W-((W-dw)/2+p.x*dw),y:(H-dh)/2+p.y*dh}}
function bounds(pts,part){const pp=part.ids.map(i=>videoMappedPoint(pts,i));let l=Math.min(...pp.map(p=>p.x)),r=Math.max(...pp.map(p=>p.x)),t=Math.min(...pp.map(p=>p.y)),b=Math.max(...pp.map(p=>p.y));const cx=(l+r)/2,cy=(t+b)/2,w=Math.max(24,(r-l)*part.factor),h=Math.max(18,(b-t)*part.factor);return{x:cx-w/2,y:cy-h/2,w,h,cx,cy}}
function sourcePatch(rect){let w=Math.max(1,Math.ceil(rect.w)),h=Math.max(1,Math.ceil(rect.h));patch.width=w;patch.height=h;pctx.clearRect(0,0,w,h);pctx.drawImage(cameraFrame,rect.x,rect.y,rect.w,rect.h,0,0,w,h);pctx.globalCompositeOperation='destination-in';const gradient=pctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.15,w/2,h/2,Math.max(w,h)*.57);gradient.addColorStop(0,'rgba(0,0,0,1)');gradient.addColorStop(.68,'rgba(0,0,0,1)');gradient.addColorStop(1,'rgba(0,0,0,0)');pctx.fillStyle=gradient;pctx.fillRect(0,0,w,h);pctx.globalCompositeOperation='source-over';return patch}
function eraseOriginal(rect){ctx.save();ctx.beginPath();ctx.ellipse(rect.cx,rect.cy,rect.w*.52,rect.h*.58,0,0,Math.PI*2);ctx.clip();ctx.filter='blur(24px)';ctx.drawImage(cameraFrame,rect.x-25,rect.y-25,rect.w+50,rect.h+50,rect.x-25,rect.y-25,rect.w+50,rect.h+50);ctx.restore()}
function movement(rect,n,t){const cycle=(t/2100)%1;let x=rect.cx,y=rect.cy;if(mode==='fall'){const top=-rect.h*.8;const bottom=H+rect.h*.8;y=top+(bottom-top)*cycle;}else{const faceCenter=faceBox||{cx:W/2,cy:H/2};let dx=rect.cx-faceCenter.cx,dy=rect.cy-faceCenter.cy;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const max=Math.min(W,H)*.9;const distance=cycle*max;x=faceCenter.cx+dx*distance;y=faceCenter.cy+dy*distance;}return{x,y}}
function stopPiece(){if(!running||finished||!landmarks||performance.now()-lastStop<350)return;lastStop=performance.now();const b=bounds(landmarks,parts[index]),m=movement(b,index,performance.now()-beginTime);placements[index]={dx:m.x-b.cx,dy:m.y-b.cy};index++;if(index===parts.length){finished=true;status('完成！ 「最初から」で再挑戦できます');$('hint').textContent='完成！';$('tapHint').hidden=true}else{beginTime=performance.now();updateHint()}}
const placements={};function restart(){index=0;for(const k of Object.keys(placements))delete placements[k];finished=false;running=true;beginTime=performance.now();lastStop=0;updateHint()}function updateHint(){const name=parts[index]?.name||'完成';$('hint').textContent='パーツ '+(index+1)+' / '+parts.length+' ： '+name;$('tapHint').hidden=false;status('モード：'+(mode==='fall'?'落下':'中心から外へ')+' | '+name+' を止めてください')}
function detection(){if(!landmarker||vid.readyState<2)return;try{if(vid.currentTime!==lastVideoTime){lastVideoTime=vid.currentTime;const result=landmarker.detectForVideo(vid,performance.now());landmarks=result.faceLandmarks?.[0]||null;blendshapes=result.faceBlendshapes?.[0]?.categories||[]}}catch(e){console.warn('tracking',e)}}
function frame(){if(!ready)return;raf=requestAnimationFrame(frame);if(vid.readyState<2)return;drawMirroredFrame();detection();ctx.drawImage(cameraFrame,0,0);if(!landmarks){$('hint').textContent='顔が検出されていません。正面を向いてください';return}if(running){const faceids=[10,152,234,454];const ps=faceids.map(i=>videoMappedPoint(landmarks,i));faceBox={cx:(Math.min(...ps.map(p=>p.x))+Math.max(...ps.map(p=>p.x)))/2,cy:(Math.min(...ps.map(p=>p.y))+Math.max(...ps.map(p=>p.y)))/2};const blinkL=blendshapes.find(x=>x.categoryName==='eyeBlinkLeft')?.score||0,blinkR=blendshapes.find(x=>x.categoryName==='eyeBlinkRight')?.score||0;const blink=blinkL>.55&&blinkR>.55;if(blink&&!previousBlink&&performance.now()-beginTime>500)stopPiece();previousBlink=blink;
// Draw blurred source slots first; then masked moving live-image patches.
for(let i=0;i<parts.length;i++)eraseOriginal(bounds(landmarks,parts[i]));for(let i=0;i<parts.length;i++){if(i>index&&!finished)continue;const b=bounds(landmarks,parts[i]);let dx=placements[i]?.dx||0,dy=placements[i]?.dy||0;if(i===index&&!finished){const m=movement(b,i,performance.now()-beginTime);dx=m.x-b.cx;dy=m.y-b.cy}const bitmap=sourcePatch(b);ctx.drawImage(bitmap,b.x+dx,b.y+dy,b.w,b.h)}
}}
async function start(){clearError();$('start').disabled=true;try{if(!window.isSecureContext)throw new Error('カメラはHTTPSまたはlocalhostでのみ利用できます。HTMLを直接開いて動かない場合はHTTPSで公開してください。');status('顔認識ライブラリを読み込み中…');const {FaceLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true};try{landmarker=await FaceLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';landmarker=await FaceLandmarker.createFromOptions(vision,opts)}status('カメラ起動中…');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:720},height:{ideal:960}}});vid.srcObject=stream;await vid.play();ready=true;$('restart').disabled=false;$('stop').disabled=false;$('start').textContent='起動中';restart();frame()}catch(e){$('start').disabled=false;status('起動できませんでした');error((e.message||String(e))+" ｜ライブラリの取得に失敗する場合、ネットワーク接続やSafariのコンテンツブロッカーも確認してください。")}}
function stop(){ready=false;running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;$('start').disabled=false;$('start').textContent='カメラを起動';$('stop').disabled=true;$('restart').disabled=true;$('hint').textContent='「カメラを起動」を押してください';$('tapHint').hidden=true;status('停止中')}
$('start').onclick=start;$('stop').onclick=stop;$('restart').onclick=restart;$('screen').addEventListener('click',stopPiece);window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
