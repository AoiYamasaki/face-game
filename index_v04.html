<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>顔福笑い | カメラゲーム</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f7f7fb;background:#101118}*{box-sizing:border-box}body{margin:0}main{width:min(600px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}h1{font-size:21px;margin:16px 0 8px}.sub{font-size:12px;color:#b6b7c4;line-height:1.6;margin:4px 0 14px}.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}button{border:0;border-radius:12px;background:#353744;color:white;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#7562e8}button.active{outline:2px solid #c1b4ff;background:#49416b}button:disabled{opacity:.5}.camera{position:relative;width:100%;aspect-ratio:3/4;background:#20212c;overflow:hidden;border-radius:20px;border:1px solid #3b3c4a;touch-action:manipulation}.camera canvas{width:100%;height:100%;object-fit:contain;display:block}.hint{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#0009;border-radius:12px;padding:8px 10px;font-size:14px;pointer-events:none}.tap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#7562e8eb;border-radius:999px;padding:12px 22px;font-weight:800;pointer-events:none;white-space:nowrap}.stat{font-size:14px;padding:5px 0;color:#dadbe9}.warning{border-radius:10px;padding:10px;background:#3e3020;color:#ffe0aa;font-size:13px;margin-top:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.help{font-size:13px;color:#c5c5d2;line-height:1.8}video{display:none}
</style></head><body><main><h1>顔福笑い <span style="font-size:12px;color:#bdb9ef">輪郭切り抜き版 v0.4</span></h1><div class="sub">カメラ映像の顔を使ったゲーム。映像は端末内で処理し、サーバーに送信しません（顔認識用ライブラリの初回読み込みには通信が必要）。</div>
<div class="bar"><button id="fall" class="active">↓ 上から落下</button><button id="radial">↗ 中心から外へ</button></div>
<div class="camera" id="screen"><canvas id="canvas" width="720" height="960"></canvas><div class="hint" id="hint">「カメラを起動」を押してください</div><div class="tap" id="tapHint" hidden>まばたき / 画面タップで止める</div></div>
<div class="stat" id="stats">モード：上から落下</div><div class="bar"><button class="primary" id="start">カメラを起動</button><button id="restart" disabled>最初から</button><button id="stop" disabled>カメラ停止</button></div>
<div class="help">使い方：正面を向き、顔が画面に収まる距離で撮影します。ゲーム開始後、動くパーツを好みの位置で<strong>まばたき</strong>するか<strong>画面タップ</strong>して止めます。眉・目・鼻・口を順番に配置します。今回は、<strong>パーツの輪郭に沿って切り抜き</strong>、元の位置は<strong>のっぺらぼう風に塗りつぶす</strong>見た目に寄せています。</div><div id="error" class="warning" hidden></div></main><video id="video" autoplay muted playsinline></video>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false}),vid=$('video');
const W=720,H=960;
const parts=[
  {name:'左眉', outline:[46,53,52,65,55,70,63,105,66,107], factor:1.22, eraseScale:1.28},
  {name:'右眉', outline:[276,283,282,295,285,300,293,334,296,336], factor:1.22, eraseScale:1.28},
  {name:'左目', outline:[33,160,159,158,157,173,133,155,154,153,145,144,163,7], factor:1.22, eraseScale:1.30},
  {name:'右目', outline:[362,385,386,387,388,466,263,249,390,373,374,380,381,382], factor:1.22, eraseScale:1.30},
  {name:'鼻', outline:[168,197,195,5,4,1,19,94,2,98,97,326,327], factor:1.28, eraseScale:1.34},
  {name:'口', outline:[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181], factor:1.18, eraseScale:1.26}
];
let landmarker=null,stream=null,mode='fall',index=0,running=false,ready=false,finished=false,previousBlink=false,lastStop=0,landmarks=null,blendshapes=[],faceBox=null,raf=0,lastVideoTime=-1,beginTime=0,skinColor='rgb(220,190,175)';
const cameraFrame=document.createElement('canvas');cameraFrame.width=W;cameraFrame.height=H;const fctx=cameraFrame.getContext('2d');
const patch=document.createElement('canvas');const pctx=patch.getContext('2d');
const placements={};
function status(s){$('stats').textContent=s}function error(s){$('error').hidden=false;$('error').textContent=s}function clearError(){$('error').hidden=true}
function setMode(next){mode=next;$('fall').classList.toggle('active',next==='fall');$('radial').classList.toggle('active',next==='radial');status('モード：'+(next==='fall'?'上から落下':'中心から外へ'));if(ready)restart()}
$('fall').onclick=()=>setMode('fall');$('radial').onclick=()=>setMode('radial');
function drawMirroredFrame(){fctx.clearRect(0,0,W,H);const vw=vid.videoWidth||W,vh=vid.videoHeight||H,scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;fctx.save();fctx.translate(W,0);fctx.scale(-1,1);fctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh);fctx.restore()}
function videoMappedPoint(pts,id){const p=pts[id],vw=vid.videoWidth||W,vh=vid.videoHeight||H,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;return{x:W-((W-dw)/2+p.x*dw),y:(H-dh)/2+p.y*dh}}
function partPoints(pts,part){return part.outline.map(i=>videoMappedPoint(pts,i))}
function centroid(points){const n=points.length||1;return points.reduce((a,p)=>({x:a.x+p.x/n,y:a.y+p.y/n}),{x:0,y:0})}
function scaledPoints(points,scale){const c=centroid(points);return points.map(p=>({x:c.x+(p.x-c.x)*scale,y:c.y+(p.y-c.y)*scale}))}
function rectFromPoints(points,factor=1){let l=Math.min(...points.map(p=>p.x)),r=Math.max(...points.map(p=>p.x)),t=Math.min(...points.map(p=>p.y)),b=Math.max(...points.map(p=>p.y));const cx=(l+r)/2,cy=(t+b)/2,w=Math.max(16,(r-l)*factor),h=Math.max(16,(b-t)*factor);return{x:cx-w/2,y:cy-h/2,w,h,cx,cy}}
function buildShape(pts,part,scale=1){const raw=partPoints(pts,part);const shape=scale===1?raw:scaledPoints(raw,scale);const rect=rectFromPoints(shape,part.factor);const c=centroid(shape);return {shape,rect,cx:c.x,cy:c.y}}
function pathFromPoints(target,points,ox=0,oy=0){if(!points.length)return;target.beginPath();target.moveTo(points[0].x-ox,points[0].y-oy);for(let i=1;i<points.length;i++)target.lineTo(points[i].x-ox,points[i].y-oy);target.closePath()}
function sourcePatch(shapeObj){const rect=shapeObj.rect;const w=Math.max(1,Math.ceil(rect.w)),h=Math.max(1,Math.ceil(rect.h));patch.width=w;patch.height=h;pctx.clearRect(0,0,w,h);pctx.drawImage(cameraFrame,rect.x,rect.y,rect.w,rect.h,0,0,w,h);pctx.globalCompositeOperation='destination-in';pathFromPoints(pctx,shapeObj.shape,rect.x,rect.y);pctx.fillStyle='#000';pctx.fill();pctx.globalCompositeOperation='source-over';return patch}
function averageColorAt(points,radius=7){let sr=0,sg=0,sb=0,count=0;for(const p of points){const x=Math.max(0,Math.min(W-1,Math.round(p.x-radius/2))),y=Math.max(0,Math.min(H-1,Math.round(p.y-radius/2)));const w=Math.max(1,Math.min(radius,W-x)),h=Math.max(1,Math.min(radius,H-y));let data;try{data=fctx.getImageData(x,y,w,h).data}catch(e){continue}for(let i=0;i<data.length;i+=4){const a=data[i+3]/255;if(a<.7)continue;sr+=data[i]*a;sg+=data[i+1]*a;sb+=data[i+2]*a;count+=a}}if(!count)return skinColor;return `rgb(${Math.round(sr/count)}, ${Math.round(sg/count)}, ${Math.round(sb/count)})`}
function updateSkinColor(pts){const ids=[205,425,50,280,9];const samples=ids.map(id=>videoMappedPoint(pts,id));skinColor=averageColorAt(samples,11)}
function eraseOriginal(shapeObj){const expanded=scaledPoints(shapeObj.shape,shapeObj.part?.eraseScale||1.28);ctx.save();ctx.filter='blur(10px)';pathFromPoints(ctx,expanded);ctx.fillStyle=skinColor;ctx.fill();ctx.restore();ctx.save();pathFromPoints(ctx,expanded);ctx.fillStyle=skinColor;ctx.globalAlpha=.98;ctx.fill();ctx.restore()}
function movement(shapeObj,t){const rect=shapeObj.rect;const cycle=(t/2100)%1;let x=shapeObj.cx,y=shapeObj.cy;if(mode==='fall'){const top=-rect.h*.8;const bottom=H+rect.h*.8;y=top+(bottom-top)*cycle;}else{const faceCenter=faceBox||{cx:W/2,cy:H/2};let dx=shapeObj.cx-faceCenter.cx,dy=shapeObj.cy-faceCenter.cy;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const max=Math.min(W,H)*.9;const distance=cycle*max;x=faceCenter.cx+dx*distance;y=faceCenter.cy+dy*distance;}return{x,y}}
function stopPiece(){if(!running||finished||!landmarks||performance.now()-lastStop<350)return;lastStop=performance.now();const part=parts[index];const shapeObj=buildShape(landmarks,part);const m=movement(shapeObj,performance.now()-beginTime);placements[index]={dx:m.x-shapeObj.cx,dy:m.y-shapeObj.cy};index++;if(index===parts.length){finished=true;status('完成！ 「最初から」で再挑戦できます');$('hint').textContent='完成！';$('tapHint').hidden=true}else{beginTime=performance.now();updateHint()}}
function restart(){index=0;for(const k of Object.keys(placements))delete placements[k];finished=false;running=true;beginTime=performance.now();lastStop=0;updateHint()}
function updateHint(){const name=parts[index]?.name||'完成';$('hint').textContent='パーツ '+(index+1)+' / '+parts.length+' ： '+name;$('tapHint').hidden=false;status('モード：'+(mode==='fall'?'落下':'中心から外へ')+' | '+name+' を止めてください')}
function detection(){if(!landmarker||vid.readyState<2)return;try{if(vid.currentTime!==lastVideoTime){lastVideoTime=vid.currentTime;const result=landmarker.detectForVideo(vid,performance.now());landmarks=result.faceLandmarks?.[0]||null;blendshapes=result.faceBlendshapes?.[0]?.categories||[]}}catch(e){console.warn('tracking',e)}}
function frame(){if(!ready)return;raf=requestAnimationFrame(frame);if(vid.readyState<2)return;drawMirroredFrame();detection();ctx.drawImage(cameraFrame,0,0);if(!landmarks){$('hint').textContent='顔が検出されていません。正面を向いてください';return}if(running){const faceids=[10,152,234,454];const ps=faceids.map(i=>videoMappedPoint(landmarks,i));faceBox={cx:(Math.min(...ps.map(p=>p.x))+Math.max(...ps.map(p=>p.x)))/2,cy:(Math.min(...ps.map(p=>p.y))+Math.max(...ps.map(p=>p.y)))/2};updateSkinColor(landmarks);const blinkL=blendshapes.find(x=>x.categoryName==='eyeBlinkLeft')?.score||0,blinkR=blendshapes.find(x=>x.categoryName==='eyeBlinkRight')?.score||0;const blink=blinkL>.55&&blinkR>.55;if(blink&&!previousBlink&&performance.now()-beginTime>500)stopPiece();previousBlink=blink;
  const liveShapes=parts.map(part=>{const obj=buildShape(landmarks,part);obj.part=part;return obj});
  for(const obj of liveShapes)eraseOriginal(obj);
  for(let i=0;i<parts.length;i++){
    if(i>index&&!finished)continue;
    const obj=liveShapes[i];
    let dx=placements[i]?.dx||0,dy=placements[i]?.dy||0;
    if(i===index&&!finished){const m=movement(obj,performance.now()-beginTime);dx=m.x-obj.cx;dy=m.y-obj.cy}
    const bitmap=sourcePatch(obj);
    ctx.drawImage(bitmap,obj.rect.x+dx,obj.rect.y+dy,obj.rect.w,obj.rect.h);
  }
}}
async function loadVision(){
 const urls=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm','https://esm.sh/@mediapipe/tasks-vision@0.10.14?bundle'];
 const errors=[];
 for(const url of urls){
  try{
   status('顔認識ライブラリ読込中（'+(errors.length+1)+'/2）…');
   const lib=await import(url);
   const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker;
   const FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;
   if(!FaceLandmarker||!FilesetResolver)throw new Error('必要な機能が見つかりません');
   return {FaceLandmarker,FilesetResolver,url};
  }catch(e){errors.push(url+' : '+(e?.message||String(e)))}
 }
 throw new Error('ライブラリを読み込めませんでした。\n'+errors.join('\n'));
}
async function start(){
 clearError();$('start').disabled=true;
 try{
  if(!window.isSecureContext)throw new Error('HTTPSのページで開いてください');
  status('カメラの使用許可を確認中…');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('このブラウザはカメラAPIに対応していません');
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:720},height:{ideal:960}}});
  vid.srcObject=stream;await vid.play();
  status('カメラ起動成功。顔認識を準備中…');
  const {FaceLandmarker,FilesetResolver}=await loadVision();
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true};
  status('顔認識モデルを読み込み中…');
  try{landmarker=await FaceLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';landmarker=await FaceLandmarker.createFromOptions(vision,opts)}
  ready=true;$('restart').disabled=false;$('stop').disabled=false;$('start').textContent='起動中';restart();frame();
 }catch(e){
  $('start').disabled=false;
  status('起動失敗（v0.4）');
  error('エラー詳細：'+(e?.message||String(e)));
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null}
 }
}
function stop(){ready=false;running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;$('start').disabled=false;$('start').textContent='カメラを起動';$('stop').disabled=true;$('restart').disabled=true;$('hint').textContent='「カメラを起動」を押してください';$('tapHint').hidden=true;status('停止中')}
$('start').onclick=start;$('stop').onclick=stop;$('restart').onclick=restart;$('screen').addEventListener('click',stopPiece);window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
