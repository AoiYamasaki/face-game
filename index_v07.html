<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>顔福笑い v0.7 | カメラゲーム</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f7f7fb;background:#101118}*{box-sizing:border-box}body{margin:0}main{width:min(600px,100%);margin:auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}h1{font-size:21px;margin:16px 0 8px}.sub{font-size:12px;color:#b6b7c4;line-height:1.6;margin:4px 0 14px}.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}button{border:0;border-radius:12px;background:#353744;color:white;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#7562e8}button.active{outline:2px solid #c1b4ff;background:#49416b}button:disabled{opacity:.5}.camera{position:relative;width:100%;aspect-ratio:3/4;background:#20212c;overflow:hidden;border-radius:20px;border:1px solid #3b3c4a;touch-action:manipulation}.camera canvas{width:100%;height:100%;object-fit:contain;display:block}.hint{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#0009;border-radius:12px;padding:8px 10px;font-size:14px;pointer-events:none}.tap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#7562e8eb;border-radius:999px;padding:12px 22px;font-weight:800;pointer-events:none;white-space:nowrap}.stat{font-size:14px;padding:5px 0;color:#dadbe9}.warning{border-radius:10px;padding:10px;background:#3e3020;color:#ffe0aa;font-size:13px;margin-top:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.help{font-size:13px;color:#c5c5d2;line-height:1.8}video{display:none}
</style></head><body><main><h1>顔福笑い <span style="font-size:12px;color:#bdb9ef">肌補完版 v0.7</span></h1><div class="sub">カメラ映像の肌の質感を残したのっぺらぼうにして、パーツを動かすゲーム。映像は端末内で処理し、サーバーに送信しません（顔認識用ライブラリの初回読み込みには通信が必要）。</div>
<div class="bar"><button id="fall" class="active">↓ 上から落下</button><button id="radial">↗ 中心から外へ</button></div>
<div class="camera" id="screen"><canvas id="canvas" width="720" height="960"></canvas><div class="hint" id="hint">「カメラを起動」を押してください</div><div class="tap" id="tapHint" hidden>まばたき / 画面タップで止める</div></div>
<div class="stat" id="stats">モード：上から落下</div><div class="bar"><button class="primary" id="start">カメラを起動</button><button id="restart" disabled>最初から</button><button id="stop" disabled>カメラ停止</button></div>
<div class="help">使い方：正面を向き、顔が画面に収まる距離で撮影します。ゲーム開始後、動くパーツを好みの位置で<strong>まばたき</strong>するか<strong>画面タップ</strong>して止めます。眉・目・鼻・口を順番に配置します。カメラ起動にはHTTPS（またはlocalhost）が必要です。</div><div id="error" class="warning" hidden></div></main><video id="video" autoplay muted playsinline></video>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false}),vid=$('video');
const W=720,H=960;
// Each feature uses a compact collection of landmarks for its actual visible extent.
const parts=[
 {name:'左眉',ids:[70,63,105,66,107,55,65,52,53,46],kind:'brow'},
 {name:'右眉',ids:[300,293,334,296,336,285,295,282,283,276],kind:'brow'},
 {name:'左目',ids:[33,133,159,145,160,144,158,153],kind:'eye'},
 {name:'右目',ids:[362,263,386,374,385,380,387,373],kind:'eye'},
 {name:'鼻',ids:[168,6,1,4,2,98,327,94],kind:'nose'},
 {name:'口',ids:[61,291,0,17,13,14,185,409],kind:'mouth'}
];
let landmarker=null,stream=null,mode='fall',index=0,running=false,ready=false,finished=false,previousBlink=false,lastStop=0,landmarks=null,blendshapes=[],faceBox=null,raf=0,lastVideoTime=-1,beginTime=0;
const cameraFrame=document.createElement('canvas');cameraFrame.width=W;cameraFrame.height=H;const fctx=cameraFrame.getContext('2d');
const patch=document.createElement('canvas'),pctx=patch.getContext('2d');
const mask=document.createElement('canvas'),mctx=mask.getContext('2d');
const faceLayer=document.createElement('canvas');faceLayer.width=W;faceLayer.height=H;const faceCtx=faceLayer.getContext('2d');
const placements={};
function status(s){$('stats').textContent=s}function error(s){$('error').hidden=false;$('error').textContent=s}function clearError(){$('error').hidden=true}
function setMode(next){mode=next;$('fall').classList.toggle('active',next==='fall');$('radial').classList.toggle('active',next==='radial');status('モード：'+(next==='fall'?'上から落下':'中心から外へ'));if(ready)restart()}
$('fall').onclick=()=>setMode('fall');$('radial').onclick=()=>setMode('radial');
function drawMirroredFrame(){fctx.clearRect(0,0,W,H);const vw=vid.videoWidth||W,vh=vid.videoHeight||H,scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;fctx.save();fctx.translate(W,0);fctx.scale(-1,1);fctx.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh);fctx.restore()}
function pt(pts,id){const p=pts[id],vw=vid.videoWidth||W,vh=vid.videoHeight||H,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;return{x:W-((W-dw)/2+p.x*dw),y:(H-dh)/2+p.y*dh}}
function bounds(pts,part){const pp=part.ids.map(i=>pt(pts,i));let l=Math.min(...pp.map(p=>p.x)),r=Math.max(...pp.map(p=>p.x)),t=Math.min(...pp.map(p=>p.y)),b=Math.max(...pp.map(p=>p.y));let cx=(l+r)/2,cy=(t+b)/2,w=r-l,h=b-t;
 if(part.kind==='eye'){w*=1.23;h=Math.max(22,h*1.9)}
 if(part.kind==='brow'){w*=1.22;h=Math.max(17,h*1.85)}
 if(part.kind==='nose'){w*=1.32;h*=1.18;cy+=h*.02}
 if(part.kind==='mouth'){w*=1.20;h=Math.max(20,h*1.65)}
 w=Math.max(23,w);h=Math.max(19,h);
 return{x:cx-w/2,y:cy-h/2,w,h,cx,cy}}
// Feature masks are curved and anti-aliased rather than polygons. The small feather
// hides any residual skin-toned edge when a patch travels over the background.
function featureShape(c,w,h,kind){c.beginPath();if(kind==='eye'){c.ellipse(w/2,h/2,w*.46,h*.44,0,0,Math.PI*2)}
 else if(kind==='brow'){c.moveTo(w*.03,h*.62);c.bezierCurveTo(w*.22,h*.06,w*.72,h*.06,w*.97,h*.45);c.bezierCurveTo(w*.72,h*.88,w*.24,h*.91,w*.03,h*.62);c.closePath()}
 else if(kind==='nose'){c.moveTo(w*.39,h*.04);c.bezierCurveTo(w*.18,h*.38,w*.10,h*.66,w*.06,h*.79);c.bezierCurveTo(w*.08,h*.99,w*.92,h*.99,w*.94,h*.79);c.bezierCurveTo(w*.90,h*.66,w*.82,h*.38,w*.61,h*.04);c.quadraticCurveTo(w*.50,-h*.02,w*.39,h*.04);c.closePath()}
 else{c.moveTo(w*.03,h*.49);c.bezierCurveTo(w*.15,h*.09,w*.38,h*.14,w*.50,h*.17);c.bezierCurveTo(w*.66,h*.13,w*.85,h*.08,w*.97,h*.49);c.bezierCurveTo(w*.86,h*.87,w*.66,h*.87,w*.50,h*.86);c.bezierCurveTo(w*.32,h*.87,w*.14,h*.88,w*.03,h*.49);c.closePath()}}
function sourcePatch(rect,kind){const w=Math.max(2,Math.ceil(rect.w)),h=Math.max(2,Math.ceil(rect.h));patch.width=mask.width=w;patch.height=mask.height=h;
 pctx.clearRect(0,0,w,h);pctx.drawImage(cameraFrame,rect.x,rect.y,rect.w,rect.h,0,0,w,h);
 mctx.clearRect(0,0,w,h);mctx.save();mctx.filter='blur(4px)';featureShape(mctx,w,h,kind);mctx.fillStyle='#fff';mctx.fill();mctx.restore();
 pctx.globalCompositeOperation='destination-in';pctx.drawImage(mask,0,0);pctx.globalCompositeOperation='source-over';return patch}
// Natural-looking removal: copy nearby intact skin textures into each facial-feature
// hole, with a soft feathered mask. The face silhouette and all other pixels remain live.
const skinPatch=document.createElement('canvas'),skinCtx=skinPatch.getContext('2d');
const holeMask=document.createElement('canvas'),holeCtx=holeMask.getContext('2d');
function skinSource(pts,part){
  // Source positions are anatomical face-mesh anchors well away from eyes/lips.
  const spec={
   '左眉':{id:205,x:0,y:0},'右眉':{id:425,x:0,y:0},
   '左目':{id:205,x:0,y:0},'右目':{id:425,x:0,y:0},
   '鼻':{id:205,x:0,y:0},'口':{id:425,x:0,y:0}
  }[part.name];
  return pt(pts,spec.id);
}
function eraseRegions(pts){
 for(const part of parts){
  const b=bounds(pts,part);
  // Keep individual holes local: do not paint or blur the entire face.
  const ext=part.kind==='nose'?1.17:part.kind==='eye'?1.18:part.kind==='brow'?1.18:1.17;
  const rw=Math.max(12,Math.ceil(b.w*ext)),rh=Math.max(12,Math.ceil(b.h*ext));
  const x=b.cx-rw/2,y=b.cy-rh/2;
  const sample=skinSource(pts,part);
  skinPatch.width=holeMask.width=rw;skinPatch.height=holeMask.height=rh;
  skinCtx.clearRect(0,0,rw,rh);
  // Choose a square of unaffected cheek pixels. Resize with smoothing and preserve texture.
  // Slight blur only to suppress lines or pores that become stretched.
  const srcSize=Math.max(18,Math.min(46,Math.round(Math.min(rw,rh)*.52)));
  const sx=Math.max(0,Math.min(W-srcSize,sample.x-srcSize/2));
  const sy=Math.max(0,Math.min(H-srcSize,sample.y-srcSize/2));
  skinCtx.filter='blur(2px)';
  skinCtx.drawImage(cameraFrame,sx,sy,srcSize,srcSize,0,0,rw,rh);
  skinCtx.filter='none';
  // Feather: alpha 1 within the damaged area; smoothly transition to the live face.
  holeCtx.clearRect(0,0,rw,rh);
  const rx=rw*.5,ry=rh*.5;
  holeCtx.save();holeCtx.translate(rx,ry);holeCtx.scale(rx,ry);
  const gr=holeCtx.createRadialGradient(0,0,.49,0,0,1);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.70,'rgba(0,0,0,1)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  holeCtx.fillStyle=gr;holeCtx.beginPath();holeCtx.arc(0,0,1,0,Math.PI*2);holeCtx.fill();holeCtx.restore();
  skinCtx.globalCompositeOperation='destination-in';skinCtx.drawImage(holeMask,0,0);
  skinCtx.globalCompositeOperation='source-over';
  ctx.drawImage(skinPatch,x,y,rw,rh);
 }
}
function movement(rect,t){const cycle=(t/2100)%1;let x=rect.cx,y=rect.cy;if(mode==='fall'){y=-rect.h*.8+(H+rect.h*1.6)*cycle}else{const center=faceBox||{cx:W/2,cy:H/2};let dx=rect.cx-center.cx,dy=rect.cy-center.cy;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const d=cycle*Math.min(W,H)*.9;x=center.cx+dx*d;y=center.cy+dy*d}return{x,y}}
function stopPiece(){if(!running||finished||!landmarks||performance.now()-lastStop<350)return;lastStop=performance.now();const b=bounds(landmarks,parts[index]),m=movement(b,performance.now()-beginTime);placements[index]={dx:m.x-b.cx,dy:m.y-b.cy};index++;if(index===parts.length){finished=true;status('完成！ 「最初から」で再挑戦できます');$('hint').textContent='完成！';$('tapHint').hidden=true}else{beginTime=performance.now();updateHint()}}
function restart(){index=0;for(const k of Object.keys(placements))delete placements[k];finished=false;running=true;beginTime=performance.now();lastStop=0;updateHint()}
function updateHint(){const name=parts[index]?.name||'完成';$('hint').textContent='パーツ '+(index+1)+' / '+parts.length+' ： '+name;$('tapHint').hidden=false;status('モード：'+(mode==='fall'?'落下':'中心から外へ')+' | '+name+' を止めてください')}
function detection(){if(!landmarker||vid.readyState<2)return;try{if(vid.currentTime!==lastVideoTime){lastVideoTime=vid.currentTime;const result=landmarker.detectForVideo(vid,performance.now());landmarks=result.faceLandmarks?.[0]||null;blendshapes=result.faceBlendshapes?.[0]?.categories||[]}}catch(e){console.warn('tracking',e)}}
function frame(){if(!ready)return;raf=requestAnimationFrame(frame);if(vid.readyState<2)return;drawMirroredFrame();detection();ctx.drawImage(cameraFrame,0,0);if(!landmarks){$('hint').textContent='顔が検出されていません。正面を向いてください';return}if(running){const faceids=[10,152,234,454];const ps=faceids.map(i=>pt(landmarks,i));faceBox={cx:(Math.min(...ps.map(p=>p.x))+Math.max(...ps.map(p=>p.x)))/2,cy:(Math.min(...ps.map(p=>p.y))+Math.max(...ps.map(p=>p.y)))/2};
 const blinkL=blendshapes.find(x=>x.categoryName==='eyeBlinkLeft')?.score||0,blinkR=blendshapes.find(x=>x.categoryName==='eyeBlinkRight')?.score||0;const blink=blinkL>.55&&blinkR>.55;if(blink&&!previousBlink&&performance.now()-beginTime>500)stopPiece();previousBlink=blink;
 eraseRegions(landmarks);
 for(let i=0;i<parts.length;i++){if(i>index&&!finished)continue;const b=bounds(landmarks,parts[i]);let dx=placements[i]?.dx||0,dy=placements[i]?.dy||0;if(i===index&&!finished){const m=movement(b,performance.now()-beginTime);dx=m.x-b.cx;dy=m.y-b.cy}const bitmap=sourcePatch(b,parts[i].kind);ctx.drawImage(bitmap,b.x+dx,b.y+dy,b.w,b.h)}
}}
async function loadVision(){
 const urls=[
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm',
  'https://esm.sh/@mediapipe/tasks-vision@0.10.14?bundle'
 ];
 const errors=[];
 for(const url of urls){
  try{
   status('顔認識ライブラリ読込中（'+(errors.length+1)+'/2）…');
   const lib=await import(url);
   const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker;
   const FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;
   if(!FaceLandmarker||!FilesetResolver)throw new Error('必要な機能が見つかりません');
   return {FaceLandmarker,FilesetResolver,url};
  }catch(e){errors.push(url+' : '+(e?.message||String(e)))}
 }
 throw new Error('ライブラリを読み込めませんでした。\n'+errors.join('\n'));
}
async function start(){
 clearError();$('start').disabled=true;
 try{
  if(!window.isSecureContext)throw new Error('HTTPSのページで開いてください');
  status('カメラの使用許可を確認中…');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('このブラウザはカメラAPIに対応していません');
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:720},height:{ideal:960}}});
  vid.srcObject=stream;await vid.play();
  status('カメラ起動成功。顔認識を準備中…');
  const {FaceLandmarker,FilesetResolver}=await loadVision();
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true};
  status('顔認識モデルを読み込み中…');
  try{landmarker=await FaceLandmarker.createFromOptions(vision,opts)}catch(e){opts.baseOptions.delegate='CPU';landmarker=await FaceLandmarker.createFromOptions(vision,opts)}
  ready=true;$('restart').disabled=false;$('stop').disabled=false;$('start').textContent='起動中';restart();frame();
 }catch(e){
  $('start').disabled=false;
  status('起動失敗（v0.7）');
  error('エラー詳細：'+(e?.message||String(e)));
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null}
 }
}
function stop(){ready=false;running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;$('start').disabled=false;$('start').textContent='カメラを起動';$('stop').disabled=true;$('restart').disabled=true;$('hint').textContent='「カメラを起動」を押してください';$('tapHint').hidden=true;status('停止中')}
$('start').onclick=start;$('stop').onclick=stop;$('restart').onclick=restart;$('screen').addEventListener('click',stopPiece);window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
